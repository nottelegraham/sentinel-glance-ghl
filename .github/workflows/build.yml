name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Codec tests
        run: g++ -std=c++17 -o codec_test test/codec_test.cpp && ./codec_test
      - name: Install PlatformIO
        run: pip install platformio esptool
      - name: Check the tag matches FW_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/.*FW_VERSION = "\(.*\)".*/\1/p' src/main.cpp)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but FW_VERSION is $v"; exit 1; }
      - name: Build
        run: pio run -e core2
      - name: Collect binaries
        run: |
          mkdir out
          cp .pio/build/core2/firmware.bin out/firmware.bin
          # full image for a blank Core2: flash at 0x0 with esptool or a web flasher
          python -m esptool --chip esp32 merge_bin -o out/sentinel-glance-full.bin \
            --flash_mode dio --flash_size 16MB \
            0x1000 .pio/build/core2/bootloader.bin \
            0x8000 .pio/build/core2/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/core2/firmware.bin
          (cd out && sha256sum *.bin > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-glance-${{ github.sha }}
          path: out/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
